<!DOCTYPE html>
<html>
<head>
    <title>Google Maps Test</title>
    <style>
        #map{
            width:100%;
            height:500px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>
function initMap(){

    const uitm = {
        lat:2.2769,
        lng:102.4505
    };

    const map = new google.maps.Map(document.getElementById("map"),{
        zoom:15,
        center:uitm
    });

    new google.maps.Marker({
        position:uitm,
        map:map
    });

}
</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyABCiOHKfwnjMOYIUv1jrbJDJa1KGiCF2c&callback=initMap">
</script>

</body>
</html>
